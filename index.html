<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="KING COBRIX — Create, watch and share short videos like TikTok.">
<title>KING COBRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#121212;--panel2:#1a1a1a;--line:#2a2a2a;
  --gold:#e7c56b;--gold2:#ffedb0;--white:#fff;
  --muted:#8a8a8a;--pink:#fe2c55;--green:#25f4ee;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;border:none;outline:none;background:none;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
#app{height:100%;position:relative}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  height:calc(52px + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:14px;padding-right:14px;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
  pointer-events:none;
}
.topbar *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:.5px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#ffefb3,#b28a2c);color:#111;display:grid;place-items:center;font-size:16px}
.brand span{color:var(--gold)}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:18px
}
.round-btn{
  background:var(--pink);color:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700
}

#feedScreen{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.reel{
  height:100%;width:100%;scroll-snap-align:start;position:relative;
  background:#000;display:flex;align-items:center;justify-content:center
}
.reel video{width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;inset:0;pointer-events:none}
.reel-gradient{position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.reel-info{
  position:absolute;bottom:calc(78px + var(--safe-b));left:14px;right:72px;z-index:5;pointer-events:none
}
.reel-info .name{font-weight:800;font-size:15px;margin-bottom:6px;text-shadow:0 1px 4px #000}
.reel-info .caption{font-size:13px;line-height:1.45;text-shadow:0 1px 4px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reel-info .sound{margin-top:8px;font-size:12px;opacity:.9}
.reel-actions{
  position:absolute;right:10px;bottom:calc(90px + var(--safe-b));z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:18px;pointer-events:auto
}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;text-shadow:0 1px 3px #000}
.act .sym{font-size:28px;filter:drop-shadow(0 2px 4px #000)}
.act .cnt{font-size:11px;font-weight:700}
.act.liked .sym{color:var(--pink)}
.act .av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#333;display:grid;place-items:center;font-weight:800;font-size:16px}
.act .av img{width:100%;height:100%;object-fit:cover}
.follow-plus{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff;
  font-size:12px;display:grid;place-items:center;font-weight:900
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  height:calc(56px + var(--safe-b));padding-bottom:var(--safe-b);
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(0,0,0,.92);border-top:1px solid rgba(255,255,255,.08)
}
.bnav{display:flex;flex-direction:column;align-items:center;gap:2px;color:#888;font-size:10px;min-width:50px;font-weight:600}
.bnav.active{color:#fff}
.bnav b{font-size:22px;font-weight:500;line-height:1}
.bnav.create{
  width:48px;height:32px;border-radius:10px;
  background:linear-gradient(90deg,var(--green),var(--pink));
  display:grid;place-items:center;position:relative
}
.bnav.create::before{
  content:'';position:absolute;inset:2px;background:#000;border-radius:8px
}
.bnav.create span{position:relative;z-index:1;font-size:26px;color:#fff;font-weight:300}

#createScreen{
  position:fixed;inset:0;z-index:100;background:#000;
  display:none;flex-direction:column
}
#createScreen.show{display:flex}
.cam-wrap{flex:1;position:relative;overflow:hidden;background:#111}
#camVideo,#previewVideo{
  width:100%;height:100%;object-fit:cover;transform:scaleX(-1)
}
#camVideo.back-cam{transform:none}
#previewVideo{transform:none}
.cam-top{
  position:absolute;top:0;left:0;right:0;z-index:10;
  padding:calc(12px + var(--safe-t)) 14px 0;
  display:flex;justify-content:space-between;align-items:center
}
.cam-btn{
  width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);
  display:grid;place-items:center;font-size:18px;backdrop-filter:blur(8px)
}
.cam-timer{
  background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums
}
.cam-bottom{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:0 0 calc(20px + var(--safe-b));
  display:flex;flex-direction:column;align-items:center;gap:16px
}
.effects-row{
  display:flex;gap:12px;overflow-x:auto;max-width:100%;padding:0 16px;
  scrollbar-width:none
}
.effects-row::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.fx-circle{
  width:52px;height:52px;border-radius:50%;border:2px solid transparent;
  overflow:hidden;background:#222;display:grid;place-items:center;font-size:20px
}
.fx.active .fx-circle{border-color:var(--gold)}
.fx span{font-size:10px;color:#ccc}
.speed-row{display:flex;gap:8px}
.spd{
  padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.12);
  font-size:12px;font-weight:700
}
.spd.active{background:#fff;color:#000}
.record-row{display:flex;align-items:center;justify-content:center;gap:36px;width:100%}
.side-btn{
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);
  display:grid;place-items:center;font-size:20px
}
.rec-btn-wrap{position:relative;width:78px;height:78px}
.rec-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--pink) var(--p,0%),transparent 0);
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))
}
.rec-btn{
  position:absolute;inset:8px;border-radius:50%;background:var(--pink);
  transition:border-radius .2s,transform .15s
}
.rec-btn.recording{border-radius:12px;transform:scale(.85)}
.mode-tabs{display:flex;gap:20px;margin-top:4px}
.mode-tab{font-size:13px;font-weight:700;color:#888;padding-bottom:4px}
.mode-tab.active{color:#fff;border-bottom:2px solid #fff}

#editScreen{
  position:fixed;inset:0;z-index:110;background:#000;
  display:none;flex-direction:column
}
#editScreen.show{display:flex}
.edit-preview{flex:1;position:relative;background:#111}
.edit-preview video{width:100%;height:100%;object-fit:contain}
.edit-top{
  position:absolute;top:0;left:0;right:0;z-index:5;
  padding:calc(12px + var(--safe-t)) 14px 0;
  display:flex;justify-content:space-between
}
.edit-bottom{
  background:#111;padding:14px 16px calc(16px + var(--safe-b));
  border-top:1px solid #222
}
.edit-tools{display:flex;justify-content:space-around;margin-bottom:14px}
.etool{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#aaa}
.etool b{font-size:22px}
.etool.active{color:var(--gold)}
.caption-box{
  width:100%;background:#1a1a1a;border:1px solid #333;border-radius:12px;
  padding:12px;color:#fff;font-size:14px;resize:none;min-height:70px;margin-bottom:12px
}
.publish-row{display:flex;gap:10px}
.btn-secondary{
  flex:1;padding:14px;border-radius:12px;background:#2a2a2a;font-weight:700;font-size:15px
}
.btn-primary{
  flex:1;padding:14px;border-radius:12px;background:var(--pink);font-weight:800;font-size:15px
}
.upload-progress{
  height:4px;background:#333;border-radius:4px;margin-bottom:10px;overflow:hidden;display:none
}
.upload-progress i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}

#pageScreen{
  position:fixed;inset:0;z-index:60;background:#0a0a0a;
  display:none;flex-direction:column;overflow-y:auto;
  padding-bottom:calc(60px + var(--safe-b))
}
#pageScreen.show{display:flex}
.page-header{
  position:sticky;top:0;z-index:5;background:#0a0a0a;
  padding:calc(12px + var(--safe-t)) 16px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a
}
.page-header h1{font-size:18px;font-weight:800;flex:1}
.back-btn{width:36px;height:36px;border-radius:50%;background:#1a1a1a;display:grid;place-items:center}
.page-body{padding:16px}
.empty{text-align:center;padding:48px 20px;color:#666}
.empty .big{font-size:48px;margin-bottom:12px}
.empty h3{color:#fff;margin-bottom:6px}
.search-input{
  width:100%;background:#1a1a1a;border-radius:12px;padding:13px 16px;
  font-size:15px;margin-bottom:16px
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid-item{aspect-ratio:9/16;background:#1a1a1a;position:relative;overflow:hidden}
.grid-item video,.grid-item img{width:100%;height:100%;object-fit:cover}
.grid-item .views{position:absolute;bottom:6px;left:6px;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000}

.profile-cover{height:120px;background:linear-gradient(135deg,#2a1f0a,#0a0a0a)}
.profile-info{padding:0 16px;margin-top:-40px}
.profile-av{
  width:88px;height:88px;border-radius:50%;border:4px solid #0a0a0a;
  background:#222;overflow:hidden;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--gold)
}
.profile-av img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:20px;font-weight:800;margin-top:10px}
.profile-handle{color:#888;font-size:13px;margin-top:2px}
.profile-bio{font-size:13px;line-height:1.5;margin-top:10px;color:#ccc}
.profile-stats{display:flex;gap:24px;margin-top:14px}
.profile-stats strong{display:block;font-size:16px}
.profile-stats span{font-size:12px;color:#888}
.edit-prof-btn{
  margin-top:14px;width:100%;padding:11px;border-radius:10px;
  background:#1a1a1a;border:1px solid #333;font-weight:700;font-size:14px
}

.modal-bg{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);
  display:none;align-items:flex-end;justify-content:center
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:480px;background:#1a1a1a;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + var(--safe-b));max-height:85vh;overflow-y:auto
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h2{font-size:18px;font-weight:800}
.close-m{width:32px;height:32px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#999;margin-bottom:6px}
.field input,.field textarea{
  width:100%;background:#0d0d0d;border:1px solid #333;border-radius:10px;
  padding:12px;color:#fff;font-size:14px
}
.field textarea{min-height:80px;resize:vertical}
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#111;padding:14px;border-radius:12px;font-weight:800;font-size:15px
}
.g-letter{width:22px;height:22px;border-radius:50%;background:#4285f4;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.error{color:#ff6b8a;font-size:12px;margin-top:10px;line-height:1.5}
.success{color:var(--green);font-size:12px;margin-top:8px}
.toast{
  position:fixed;bottom:calc(70px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;border:1px solid #333;border-radius:12px;padding:12px 18px;
  font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.comment-item{padding:12px 0;border-bottom:1px solid #2a2a2a;font-size:13px;line-height:1.5}
.comment-form{display:flex;gap:8px;margin-top:12px}
.comment-form input{flex:1;background:#0d0d0d;border:1px solid #333;border-radius:20px;padding:11px 14px}
.comment-form button{width:42px;height:42px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:16px}

.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0;border-bottom:1px solid #1f1f1f
}
.settings-row strong{font-size:14px}
.settings-row p{font-size:12px;color:#777;margin-top:3px}
.lang-select{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px 12px;color:#fff}

.f-vintage{filter:sepia(.45) contrast(1.1) brightness(.95)}
.f-cool{filter:saturate(1.2) hue-rotate(15deg) brightness(1.05)}
.f-warm{filter:sepia(.25) saturate(1.3) brightness(1.05)}
.f-bw{filter:grayscale(1) contrast(1.15)}
.f-vivid{filter:saturate(1.6) contrast(1.15)}
.f-soft{filter:brightness(1.08) contrast(.92) saturate(.9)}
.f-drama{filter:contrast(1.35) brightness(.9) saturate(1.2)}
.f-pink{filter:hue-rotate(-20deg) saturate(1.4) brightness(1.05)}
.f-cyber{filter:hue-rotate(180deg) saturate(1.5) contrast(1.1)}

.text-overlay{
  position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000,0 0 4px #000;
  pointer-events:none;text-align:center;max-width:90%;word-break:break-word;z-index:4
}

@media(min-width:768px){
  #feedScreen,.bottom-nav,#createScreen,#editScreen,#pageScreen{max-width:480px;margin:0 auto;left:0;right:0}
  .topbar{max-width:480px;left:50%;transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="app">
  <div id="feedScreen"></div>

  <header class="topbar" id="topBar">
    <div class="brand"><div class="brand-mark">♛</div>KING <span>COBRIX</span></div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openPage('discover')" title="Search">⌕</button>
      <button class="icon-btn" onclick="openPage('notifications')">♡</button>
      <button class="round-btn" id="topAccount" onclick="openAuth()">Sign in</button>
    </div>
  </header>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bnav active" data-page="home" onclick="goHome()"><b>⌂</b>Home</button>
    <button class="bnav" data-page="discover" onclick="openPage('discover')"><b>⌕</b>Discover</button>
    <button class="bnav create" onclick="openCreate()"><span>＋</span></button>
    <button class="bnav" data-page="inbox" onclick="openPage('inbox')"><b>▤</b>Inbox</button>
    <button class="bnav" data-page="profile" onclick="openPage('profile')"><b>◉</b>Profile</button>
  </nav>

  <!-- CAMERA -->
  <div id="createScreen">
    <div class="cam-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-top">
        <button class="cam-btn" onclick="closeCreate()">✕</button>
        <div class="cam-timer" id="camTimer">00:00</div>
        <button class="cam-btn" onclick="flipCamera()">⟳</button>
      </div>
      <div class="cam-bottom">
        <div class="effects-row" id="effectsRow"></div>
        <div class="speed-row">
          <button class="spd" data-speed="0.5" onclick="setSpeed(0.5)">0.5x</button>
          <button class="spd active" data-speed="1" onclick="setSpeed(1)">1x</button>
          <button class="spd" data-speed="2" onclick="setSpeed(2)">2x</button>
          <button class="spd" data-speed="3" onclick="setSpeed(3)">3x</button>
        </div>
        <div class="record-row">
          <button class="side-btn" onclick="pickGallery()" title="Upload">
            <div style="width:40px;height:40px;border-radius:8px;background:#333;display:grid;place-items:center;font-size:18px">🖼</div>
          </button>
          <div class="rec-btn-wrap">
            <div class="rec-ring" id="recRing"></div>
            <button class="rec-btn" id="recBtn" onclick="toggleRecord()"></button>
          </div>
          <button class="side-btn" onclick="toggleFlash()" id="flashBtn" title="Flash">⚡</button>
        </div>
        <div class="mode-tabs">
          <button class="mode-tab" data-mode="15s" onclick="setMaxDuration(15)">15s</button>
          <button class="mode-tab active" data-mode="60s" onclick="setMaxDuration(60)">60s</button>
          <button class="mode-tab" data-mode="3m" onclick="setMaxDuration(180)">3m</button>
        </div>
      </div>
    </div>
    <input type="file" id="galleryInput" accept="video/*" class="hidden">
  </div>

  <!-- EDIT -->
  <div id="editScreen">
    <div class="edit-preview">
      <video id="previewVideo" playsinline loop></video>
      <div id="textOverlay" class="text-overlay hidden"></div>
      <div class="edit-top">
        <button class="cam-btn" onclick="backToCamera()">✕</button>
        <button class="cam-btn" onclick="togglePreviewMute()" id="muteBtn">🔊</button>
      </div>
    </div>
    <div class="edit-bottom">
      <div class="edit-tools">
        <button class="etool" id="toolText" onclick="toggleTextTool()"><b>T</b>Text</button>
        <button class="etool" id="toolFilter" onclick="showEditFilters()"><b>✦</b>Filters</button>
        <button class="etool" onclick="toast('Add your own music later via device')"><b>♪</b>Sounds</button>
        <button class="etool" onclick="toast('More effects coming')"><b>✨</b>Effects</button>
        <button class="etool" onclick="toast('Voiceover coming soon')"><b>🎤</b>Voice</button>
      </div>
      <div id="editFilterRow" class="effects-row hidden" style="margin-bottom:12px"></div>
      <div id="textInputWrap" class="hidden" style="margin-bottom:10px">
        <input id="textInput" maxlength="80" placeholder="Add text on video..." style="width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:11px;color:#fff">
      </div>
      <textarea class="caption-box" id="editCaption" maxlength="1500" placeholder="Write a caption... #KingCobrix"></textarea>
      <div class="upload-progress" id="uploadProgress"><i id="uploadBar"></i></div>
      <div class="publish-row">
        <button class="btn-secondary" onclick="backToCamera()">Retake</button>
        <button class="btn-primary" id="postBtn" onclick="publishVideo()">Post</button>
      </div>
      <div class="error" id="editError"></div>
      <div class="success" id="editSuccess"></div>
    </div>
  </div>

  <div id="pageScreen">
    <div class="page-header">
      <button class="back-btn" onclick="closePage()">←</button>
      <h1 id="pageTitle">Page</h1>
    </div>
    <div class="page-body" id="pageBody"></div>
  </div>
</div>

<div class="modal-bg" id="authModal">
  <div class="modal">
    <div class="modal-head"><h2>♛ KING COBRIX</h2><button class="close-m" onclick="closeModal('authModal')">×</button></div>
    <p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:18px">Sign in with Google to create, like, comment and follow.</p>
    <button class="google-btn" id="googleLogin"><span class="g-letter">G</span> Continue with Google</button>
    <div class="error" id="authError"></div>
    <p class="muted" style="font-size:11px;margin-top:14px;line-height:1.5">By continuing you agree to use the platform respectfully.</p>
  </div>
</div>

<div class="modal-bg" id="profileModal">
  <div class="modal">
    <div class="modal-head"><h2>Edit profile</h2><button class="close-m" onclick="closeModal('profileModal')">×</button></div>
    <form id="editProfileForm">
      <div class="field"><label>Display name</label><input id="editName" maxlength="60" required></div>
      <div class="field"><label>Username</label><input id="editUsername" maxlength="24" minlength="3" pattern="[A-Za-z0-9_.]+" required></div>
      <div class="field"><label>Bio</label><textarea id="editBio" maxlength="160"></textarea></div>
      <div class="field"><label>Photo URL (optional)</label><input id="editPhoto" type="url" placeholder="https://..."></div>

function renderFeed(){
  const root = $("feedScreen");
  if(feedObserver){ feedObserver.disconnect(); feedObserver = null; }

  const videos = [...localVideos, ...allVideos];
  if(!videos.length){
    root.innerHTML = `<div class="reel" style="flex-direction:column;gap:12px;color:#666">
      <div style="font-size:56px">🎬</div>
      <h2 style="color:#fff">${t("noVideos")}</h2>
      <p>${t("noVideosText")}</p>
      <button class="round-btn" style="margin-top:12px" onclick="openCreate()">＋ Create</button>
    </div>`;
    return;
  }

  root.innerHTML = videos.map(v => {
    const isLiked = liked.has(v.id);
    const src = v.localUrl || v.videoUrl || "";
    const fcls = v.filterClass || getFilterClass(v.filter) || "";
    return `<div class="reel" data-id="${esc(v.id)}">
      <video src="${esc(src)}" playsinline loop preload="metadata" data-vid="${esc(v.id)}" class="${fcls}"></video>
      ${v.overlayText ? `<div class="text-overlay">${esc(v.overlayText)}</div>` : ""}
      <div class="reel-overlay"><div class="reel-gradient"></div></div>
      <div class="reel-info">
        <div class="name">@${esc(v.username || "creator")}</div>
        <div class="caption">${esc(v.caption || "")}</div>
        <div class="sound">♬ Original sound · ${esc(v.username || "creator")}</div>
      </div>
      <div class="reel-actions">
        <button class="act" onclick="viewCreator('${esc(v.userId||"")}')">
          <div class="av">${avatarHTML({displayName:v.displayName, photoURL:v.photoURL})}</div>
          ${v.userId && v.userId !== currentUser?.uid ? `<div class="follow-plus" onclick="event.stopPropagation();toggleFollow('${esc(v.userId)}')">＋</div>` : ""}
        </button>
        <button class="act ${isLiked?"liked":""}" onclick="toggleLike('${esc(v.id)}')">
          <span class="sym">${isLiked?"♥":"♡"}</span>
          <span class="cnt">${fmt(v.likesCount || 0)}</span>
        </button>
        <button class="act" onclick="openComments('${esc(v.id)}')">
          <span class="sym">💬</span>
          <span class="cnt">${fmt(v.commentsCount || 0)}</span>
        </button>
        <button class="act" onclick="shareVideo('${esc(v.id)}')">
          <span class="sym">↗</span>
          <span class="cnt">Share</span>
        </button>
      </div>
    </div>`;
  }).join("");

  feedObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const vid = en.target.querySelector("video");
      if(!vid) return;
      if(en.isIntersecting && en.intersectionRatio > 0.55){
        document.querySelectorAll("#feedScreen video").forEach(v => { if(v !== vid){ v.pause(); v.currentTime = 0; } });
        vid.muted = false;
        vid.play().catch(() => { vid.muted = true; vid.play().catch(()=>{}); });
      } else {
        vid.pause();
      }
    });
  }, { threshold: [0.55, 0.7] });

  root.querySelectorAll(".reel").forEach(r => feedObserver.observe(r));
  root.querySelectorAll("video").forEach(v => {
    v.addEventListener("click", () => {
      if(v.paused) v.play().catch(()=>{}); else v.pause();
    });
  });
}

window.openCreate = async () => {

function closeEdit(){

    // keep until published or retake
  }

async function startCamera(){
  stopCamera();
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1080 }, height: { ideal: 1920 } },
      audio: true
    });
    const v = $("camVideo");
    v.srcObject = mediaStream;
    v.classList.toggle("back-cam", facingMode === "environment");
    applyFilterToVideo(v);
  }catch(err){
    toast("Camera permission required: " + (err.message || ""));
    console.error(err);
  }
}
function stopCamera(){
  if(mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  const v = $("camVideo");
  if(v) v.srcObject = null;
}

window.flipCamera = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  await startCamera();
};

window.toggleFlash = async () => {
  if(!mediaStream) return;
  const track = mediaStream.getVideoTracks()[0];
  const caps = track.getCapabilities?.() || {};
  if(!caps.torch){ toast("Flash not supported on this camera"); return; }
  flashOn = !flashOn;
  try{
    await track.applyConstraints({ advanced: [{ torch: flashOn }] });
    $("flashBtn").style.color = flashOn ? "var(--gold)" : "";
  }catch{ toast("Could not toggle flash"); }
};

function buildEffects(row, forCam){
  if(!row) return;
  row.innerHTML = FILTERS.map(f => `
    <button class="fx ${currentFilter===f.id?"active":""}" data-f="${f.id}" onclick="selectFilter('${f.id}', ${forCam})">
      <div class="fx-circle ${f.cls}" style="background:linear-gradient(135deg,#444,#1a1a1a)">${f.id==="none"?"◎":"✦"}</div>
      <span>${f.name}</span>
    </button>
  `).join("");
}
window.selectFilter = (id, forCam) => {
  currentFilter = id;
  if(forCam){
    buildEffects($("effectsRow"), true);
    applyFilterToVideo($("camVideo"));
  } else {
    buildEffects($("editFilterRow"), false);
    applyFilterToVideo($("previewVideo"));
  }
};
function applyFilterToVideo(el){
  if(!el) return;
  FILTERS.forEach(f => { if(f.cls) el.classList.remove(f.cls); });
  const f = FILTERS.find(x => x.id === currentFilter);
  if(f && f.cls) el.classList.add(f.cls);
}

window.setSpeed = (s) => {
  currentSpeed = s;
  document.querySelectorAll(".spd").forEach(b => b.classList.toggle("active", Number(b.dataset.speed) === s));
  // Note: true variable-speed recording needs canvas processing; we store preferred speed for playback hint
};
window.setMaxDuration = (sec) => {
  maxDuration = sec;
  document.querySelectorAll(".mode-tab").forEach(b => {
    const m = b.dataset.mode;
    b.classList.toggle("active", (m==="15s"&&sec===15)||(m==="60s"&&sec===60)||(m==="3m"&&sec===180));
  });
};

window.toggleRecord = () => {
  if(isRecording) stopRecord(false);
  else startRecord();
};

function startRecord(){
  if(!mediaStream){ toast("Camera not ready"); return; }
  recordedChunks = [];
  let mime = "video/webm;codecs=vp9,opus";
  if(!MediaRecorder.isTypeSupported(mime)) mime = "video/webm;codecs=vp8,opus";
  if(!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";
  if(!MediaRecorder.isTypeSupported(mime)) mime = "";

  try{
    mediaRecorder = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
  }catch(e){
    mediaRecorder = new MediaRecorder(mediaStream);
  }

  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if(recordedChunks.length === 0){ toast("Recording failed — try again"); return; }
    const type = mediaRecorder.mimeType || "video/webm";
    recordedBlob = new Blob(recordedChunks, { type });
    recordedUrl = URL.createObjectURL(recordedBlob);
    openEditScreen();
  };
  mediaRecorder.start(200);
  isRecording = true;
  recordStart = Date.now();
  $("recBtn").classList.add("recording");
  updateTimer();
  recordTimer = setInterval(updateTimer, 80);
}

function stopRecord(cancel){
  if(mediaRecorder && mediaRecorder.state !== "inactive"){
    if(cancel) mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  isRecording = false;
  clearInterval(recordTimer);
  $("recBtn").classList.remove("recording");
  $("recRing").style.setProperty("--p", "0%");
  $("camTimer").textContent = "00:00";
}

function updateTimer(){
  const elapsed = (Date.now() - recordStart) / 1000;
  const m = Math.floor(elapsed / 60);
  const s = Math.floor(elapsed % 60);
  $("camTimer").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  const pct = Math.min(100, (elapsed / maxDuration) * 100);
  $("recRing").style.setProperty("--p", pct + "%");
  if(elapsed >= maxDuration) stopRecord(false);
}

window.pickGallery = () => $("galleryInput").click();
$("galleryInput").onchange = (e) => {

/* ===== PUBLISH (Storage + Firestore) ===== */
window.publishVideo = async () => {
  if(!signedIn()) return;
  const caption = $("editCaption").value.trim();
  if(!caption){ $("editError").textContent = "Please write a caption."; return; }
  if(!recordedBlob){ $("editError").textContent = "No video."; return; }

  $("editError").textContent = "";
  $("postBtn").disabled = true;
  $("uploadProgress").style.display = "block";
  $("editSuccess").textContent = t("uploading");

  const p = myProfile || {};
  const filterCls = getFilterClass(currentFilter);
  const localId = "local_" + Date.now();

  // Optimistic local preview
  const localVideo = {
    id: localId,
    userId: currentUser.uid,
    displayName: p.displayName || currentUser.displayName || "Creator",
    username: p.username || "creator",
    photoURL: p.photoURL || currentUser.photoURL || "",
    caption,
    localUrl: recordedUrl,
    filter: currentFilter,
    filterClass: filterCls,
    overlayText: overlayText || "",
    createdAt: Date.now(),
    likesCount: 0,
    commentsCount: 0
  };
  localVideos.unshift(localVideo);

  try{
    // 1) Upload to Firebase Storage
    const ext = (recordedBlob.type || "").includes("mp4") ? "mp4" : "webm";
    const path = `videos/${currentUser.uid}/${Date.now()}.${ext}`;
    const storageRef = ref(storage, path);
    const task = uploadBytesResumable(storageRef, recordedBlob, {
      contentType: recordedBlob.type || "video/webm",
      customMetadata: { uploadedBy: currentUser.uid, caption: caption.slice(0,100) }
    });

    const videoUrl = await new Promise((resolve, reject) => {
      task.on("state_changed",
        (snap) => {
          const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          $("uploadBar").style.width = pct + "%";
        },
        (err) => reject(err),
        async () => {
          try{
            const url = await getDownloadURL(task.snapshot.ref);
            resolve(url);
          }catch(e){ reject(e); }
        }
      );
    });

    // 2) Save metadata to Firestore
    const docRef = await addDoc(collection(db, "videos"), {
      userId: currentUser.uid,
      displayName: localVideo.displayName,
      username: localVideo.username,
      photoURL: localVideo.photoURL,
      caption,
      videoUrl,
      filter: currentFilter,
      overlayText: overlayText || "",
      likesCount: 0,
      commentsCount: 0,
      storagePath: path,
      createdAt: serverTimestamp()
    });

    // Update local entry with real id + url
    const idx = localVideos.findIndex(v => v.id === localId);
    if(idx >= 0){
      localVideos[idx] = {
        ...localVideos[idx],
        id: docRef.id,
        videoUrl,
        localUrl: null
      };
    }

    // Update user posts count
    try{
      await updateDoc(doc(db, "users", currentUser.uid), {
        postsCount: increment(1),
        updatedAt: serverTimestamp()
      });
    }catch(_){}

    $("editSuccess").textContent = t("uploadDone");
    toast(t("uploadDone"));
    setTimeout(() => {
      closeEdit();
      closeCreate();
      goHome();
    }, 600);

  }catch(err){
    console.error("Publish error:", err);
    $("editError").textContent = "Upload failed: " + (err.message || "Check Storage rules & Auth");
    $("postBtn").disabled = false;
    // keep local preview so user still sees their video
    toast("Saved locally. Cloud upload failed — check Firebase Storage rules.");
    setTimeout(() => {
      closeEdit();
      closeCreate();
      goHome();
    }, 1200);
  }
};

      </div>`).join("") : `<div class="empty" style="grid-column:1/-1"><div class="big">⌕</div><h3>No videos</h3></div>`}
    </div>`;
  $("searchQ").oninput = () => {

      (v.caption||"").toLowerCase().includes(q) ||
      (v.username||"").toLowerCase().includes(q) ||

    $("searchRes").innerHTML = filtered.length ? filtered.map(v => `
      <div class="grid-item" onclick="goHome()">
        <video src="${esc(v.localUrl||v.videoUrl)}" muted playsinline preload="metadata"></video>
        <span class="views">▶ ${fmt(v.likesCount||0)}</span>
      </div>`).join("") : `<div class="empty" style="grid-column:1/-1"><div class="big">⌕</div><h3>No results</h3></div>`;
  };
}

function renderProfile(){
  if(!currentUser){
    $("pageBody").innerHTML = `<div class="empty"><div class="big">◉</div><h3>${t("notSigned")}</h3>
      <button class="round-btn" style="margin-top:12px" onclick="openAuth()">Sign in</button></div>`;
    return;
  }
  const p = myProfile || {};
  const myVids = [...localVideos, ...allVideos].filter(v => v.userId === currentUser.uid);
  $("pageBody").innerHTML = `
    <div class="profile-cover"></div>
    <div class="profile-info">
      <div class="profile-av">${avatarHTML({displayName:p.displayName||currentUser.displayName, photoURL:p.photoURL||currentUser.photoURL})}</div>
      <div class="profile-name">${esc(p.displayName||currentUser.displayName||"Creator")}</div>
      <div class="profile-handle">@${esc(p.username||"creator")}</div>
      <div class="profile-bio">${esc(p.bio||"No bio yet.")}</div>
      <div class="profile-stats">
        <div><strong>${myVids.length}</strong><span>Videos</span></div>
        <div><strong>${fmt(p.followersCount||0)}</strong><span>Followers</span></div>
        <div><strong>${fmt(p.followingCount||0)}</strong><span>Following</span></div>
      </div>
      <button class="edit-prof-btn" onclick="openEditProfile()">Edit profile</button>
      <button class="edit-prof-btn" style="margin-top:8px" onclick="openPage('settings')">Settings & Language</button>
    </div>
    <div class="grid" style="margin-top:20px">${myVids.length ? myVids.map(v => `
      <div class="grid-item">
        <video src="${esc(v.localUrl||v.videoUrl)}" muted playsinline preload="metadata" class="${v.filterClass||getFilterClass(v.filter)||""}"></video>
        <span class="views">▶ ${fmt(v.likesCount||0)}</span>
      </div>`).join("") : `<div class="empty" style="grid-column:1/-1"><div class="big">🎥</div><h3>No videos yet</h3><button class="round-btn" style="margin-top:10px" onclick="openCreate()">Create</button></div>`}
    </div>`;
}

function renderSettings(){
  $("pageBody").innerHTML = `
    <div class="settings-row">
      <div><strong>Language</strong><p>App language</p></div>
      <select class="lang-select" id="langSel">
        <option value="en" ${currentLang==="en"?"selected":""}>English</option>
        <option value="ur" ${currentLang==="ur"?"selected":""}>اردو</option>
      </select>
    </div>
    <div class="settings-row">
      <div><strong>Account</strong><p>${esc(currentUser?.email||"Guest")}</p></div>
      ${currentUser ? `<button class="btn-secondary" style="width:auto;padding:8px 14px;color:#ff6b8a" onclick="logout()">Sign out</button>` : `<button class="round-btn" onclick="openAuth()">Sign in</button>`}
    </div>
    <div class="settings-row"><div><strong>Privacy</strong><p>Never share private info publicly</p></div><span>🔒</span></div>
    <div class="settings-row"><div><strong>Version</strong><p>KING COBRIX · 2.1 Full features</p></div><span class="gold">2.1</span></div>`;
  $("langSel").onchange = () => {
    currentLang = $("langSel").value;
    localStorage.setItem("kc_language", currentLang);
    toast(currentLang === "ur" ? "زبان تبدیل ہوگئی" : "Language updated");
  };
}

window.openEditProfile = () => {
  if(!signedIn()) return;
  $("editName").value = myProfile?.displayName || currentUser.displayName || "";
  $("editUsername").value = myProfile?.username || ("creator_" + currentUser.uid.slice(0,6));
  $("editBio").value = myProfile?.bio || "";
  $("editPhoto").value = myProfile?.photoURL || currentUser.photoURL || "";
  $("profileError").textContent = "";
  showModal("profileModal");
};

$("editProfileForm").onsubmit = async (e) => {
  e.preventDefault();
  if(!currentUser) return;
  const displayName = $("editName").value.trim();
  const username = $("editUsername").value.trim().replace(/^@/,"");
  const bio = $("editBio").value.trim();
  const photoURL = $("editPhoto").value.trim();
  if(!/^[A-Za-z0-9_.]{3,24}$/.test(username)){
    $("profileError").textContent = "Username: 3–24 letters, numbers, _ or .";
    return;
  }
  try{
    await updateProfile(currentUser, { displayName, photoURL: photoURL || null });
    const data = { uid: currentUser.uid, displayName, username, bio, photoURL, email: currentUser.email||"", updatedAt: serverTimestamp() };
    await setDoc(doc(db, "users", currentUser.uid), data, { merge: true });
    myProfile = { ...myProfile, ...data };
    closeModal("profileModal");
    toast(t("saved"));
    renderProfile();
    updateTopAccount();
  }catch(err){
    $("profileError").textContent = "Could not save: " + (err.message||"");
  }
};

/* ===== LIKES / FOLLOW / COMMENTS / SHARE ===== */
window.toggleLike = async (id) => {
  if(!signedIn()) return;
  const was = liked.has(id);
  if(was) liked.delete(id); else liked.add(id);

  // Optimistic UI
  const v = allVideos.find(x => x.id === id) || localVideos.find(x => x.id === id);
  if(v) v.likesCount = Math.max(0, (v.likesCount || 0) + (was ? -1 : 1));
  renderFeed();

  if(id.startsWith("local_")) return;

  try{
    const likeRef = doc(db, "videos", id, "likes", currentUser.uid);
    const videoRef = doc(db, "videos", id);
    if(was){
      await deleteDoc(likeRef);
      await updateDoc(videoRef, { likesCount: increment(-1) });
    } else {
      await setDoc(likeRef, { userId: currentUser.uid, createdAt: serverTimestamp() });
      await updateDoc(videoRef, { likesCount: increment(1) });
    }
  }catch(err){
    console.warn(err);
    // revert
    if(was) liked.add(id); else liked.delete(id);
    if(v) v.likesCount = Math.max(0, (v.likesCount || 0) + (was ? 1 : -1));
    renderFeed();
    toast(t("likeFail"));
  }
};

window.toggleFollow = async (uid) => {
  if(!signedIn() || !uid || uid === currentUser.uid) return;
  const was = followed.has(uid);
  if(was) followed.delete(uid); else followed.add(uid);
  toast(was ? t("unfollowOk") : t("followOk"));
  renderFeed();

  try{
    const followRef = doc(db, "users", currentUser.uid, "following", uid);
    const myRef = doc(db, "users", currentUser.uid);
    const theirRef = doc(db, "users", uid);
    if(was){
      await deleteDoc(followRef);
      await updateDoc(myRef, { followingCount: increment(-1) });
      await updateDoc(theirRef, { followersCount: increment(-1) });
    } else {
      await setDoc(followRef, { userId: uid, createdAt: serverTimestamp() });
      await updateDoc(myRef, { followingCount: increment(1) });
      await updateDoc(theirRef, { followersCount: increment(1) });
    }
    if(myProfile){
      myProfile.followingCount = Math.max(0, (myProfile.followingCount||0) + (was ? -1 : 1));
    }
  }catch(err){
    console.warn("Follow sync:", err);
  }
};

window.shareVideo = async (id) => {
  const url = location.origin + location.pathname + "#v-" + encodeURIComponent(id);
  try{
    if(navigator.share) await navigator.share({ title: "KING COBRIX", text: "Watch this on KING COBRIX", url });
    else { await navigator.clipboard.writeText(url); toast(t("shareCopied")); }
  }catch{
    try{ await navigator.clipboard.writeText(url); toast(t("shareCopied")); }catch{ toast(url); }
  }
};

window.openComments = async (id) => {
  if(!signedIn()) return;
  activeCommentVideo = id;
  $("commentList").innerHTML = `<p class="muted">Loading…</p>`;
  $("commentError").textContent = "";
  showModal("commentModal");
  if(id.startsWith("local_")){
    $("commentList").innerHTML = `<p class="muted">Comments available after cloud upload.</p>`;
    return;
  }
  try{
    const snap = await getDocs(query(collection(db, "videos", id, "comments"), orderBy("createdAt","desc"), limit(80)));
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    $("commentList").innerHTML = list.length
      ? list.map(c => `<div class="comment-item"><strong>${esc(c.displayName||"Creator")}</strong><br>${esc(c.text||"")}</div>`).join("")
      : `<p class="muted">${t("noComments")}</p>`;
  }catch(err){
    $("commentList").innerHTML = `<p class="muted">${t("noComments")}</p>`;
    $("commentError").textContent = t("commentsFailed");
  }
};

$("commentForm").onsubmit = async (e) => {
  e.preventDefault();
  if(!signedIn() || !activeCommentVideo) return;
  const text = $("commentInput").value.trim();
  if(!text) return;
  if(activeCommentVideo.startsWith("local_")){
    $("commentError").textContent = "Upload video first to enable comments.";
    return;
  }
  try{
    await addDoc(collection(db, "videos", activeCommentVideo, "comments"), {
      userId: currentUser.uid,
      displayName: myProfile?.displayName || currentUser.displayName || "Creator",
      text,
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "videos", activeCommentVideo), { commentsCount: increment(1) });
    const v = allVideos.find(x => x.id === activeCommentVideo);
    if(v) v.commentsCount = (v.commentsCount || 0) + 1;
    $("commentInput").value = "";
    await window.openComments(activeCommentVideo);
    toast("Comment added");
  }catch(err){
    $("commentError").textContent = err.message || "Failed to post";
  }
};

window.viewCreator = async (uid) => {
  if(!uid){ toast("Profile unavailable"); return; }
  if(uid === currentUser?.uid){ openPage("profile"); return; }
  try{
    const p = await loadUserProfile(uid);
    const videos = allVideos.filter(v => v.userId === uid);
    openPage("profile");
    $("pageTitle").textContent = p.displayName || "Creator";
    $("pageBody").innerHTML = `
      <div class="profile-cover"></div>
      <div class="profile-info">
        <div class="profile-av">${avatarHTML({displayName:p.displayName||videos[0]?.displayName, photoURL:p.photoURL||videos[0]?.photoURL})}</div>
        <div class="profile-name">${esc(p.displayName||videos[0]?.displayName||"Creator")}</div>
        <div class="profile-handle">@${esc(p.username||videos[0]?.username||"creator")}</div>
        <div class="profile-bio">${esc(p.bio||"No bio yet.")}</div>
        <div class="profile-stats">
          <div><strong>${videos.length}</strong><span>Videos</span></div>
          <div><strong>${fmt(p.followersCount||0)}</strong><span>Followers</span></div>
          <div><strong>${fmt(p.followingCount||0)}</strong><span>Following</span></div>
        </div>
        <button class="edit-prof-btn" onclick="toggleFollow('${esc(uid)}')">${followed.has(uid)?"Following":"Follow"}</button>
      </div>
      <div class="grid" style="margin-top:16px">${videos.length ? videos.map(v => `
        <div class="grid-item"><video src="${esc(v.videoUrl)}" muted playsinline preload="metadata"></video>
        <span class="views">▶ ${fmt(v.likesCount||0)}</span></div>`).join("") : `<div class="empty" style="grid-column:1/-1"><div class="big">🎥</div><h3>No public videos</h3></div>`}
      </div>`;
  }catch{ toast("Could not open profile"); }
};

/* ===== AUTH + DATA ===== */
async function loadUserProfile(uid){
  try{
    const snap = await getDoc(doc(db, "users", uid));
    if(snap.exists()) return snap.data();
  }catch(e){ console.warn(e); }
  return {};
}

async function loadMyLikesAndFollows(){
  if(!currentUser) return;
  liked.clear(); followed.clear();
  try{
    // Load following
    const folSnap = await getDocs(collection(db, "users", currentUser.uid, "following"));
    folSnap.forEach(d => followed.add(d.id));
  }catch(e){ console.warn("following load", e); }

  // Likes are checked per-video on demand; we also try to hydrate from recent videos
  try{
    for(const v of allVideos.slice(0, 30)){
      try{
        const likeSnap = await getDoc(doc(db, "videos", v.id, "likes", currentUser.uid));
        if(likeSnap.exists()) liked.add(v.id);
      }catch(_){}
    }
  }catch(_){}
}

async function afterLogin(user){
  currentUser = user;
  myProfile = await loadUserProfile(user.uid);
  if(!myProfile.username){
    const username = "creator_" + user.uid.slice(0,6);
    myProfile = { ...myProfile, uid: user.uid, displayName: user.displayName||"Creator", username, bio:"", photoURL: user.photoURL||"", followersCount:0, followingCount:0, postsCount:0 };
    try{
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid, displayName: myProfile.displayName, username, bio:"",
        photoURL: user.photoURL||"", email: user.email||"",
        followersCount:0, followingCount:0, postsCount:0,
        createdAt: serverTimestamp()
      }, { merge: true });
    }catch(e){ console.warn(e); }
  }
  $("authError").textContent = "";
  closeModal("authModal");
  updateTopAccount();
  await loadVideos();
  await loadMyLikesAndFollows();
  goHome();
  toast("Welcome to KING COBRIX!");
}

function updateTopAccount(){
  $("topAccount").textContent = currentUser
    ? (myProfile?.displayName || currentUser.displayName || "Account").slice(0, 14)
    : "Sign in";
}

async function loadVideos(){
  try{
    const snap = await getDocs(query(collection(db, "videos"), orderBy("createdAt","desc"), limit(50)));
    const rows = [];
    snap.forEach(d => {
      const v = d.data();
      if(v.videoUrl) rows.push({ id: d.id, ...v, filterClass: getFilterClass(v.filter) });
    });
    allVideos = rows;
    // remove local duplicates that were already uploaded
    localVideos = localVideos.filter(lv => !allVideos.some(av => av.videoUrl && lv.videoUrl === av.videoUrl));
    renderFeed();
  }catch(err){
    console.warn("Feed load:", err);
    renderFeed();
  }
}

window.logout = async () => {
  if(!currentUser || !confirm("Sign out of KING COBRIX?")) return;
  try{
    await signOut(auth);
    currentUser = null; myProfile = null; allVideos = []; localVideos = [];
    liked.clear(); followed.clear();
    updateTopAccount();
    goHome();
    toast("Signed out");
  }catch(e){ toast(e.message); }
};

$("googleLogin").onclick = async () => {
  $("authError").textContent = "";
  try{
    const result = await signInWithPopup(auth, provider);
    await afterLogin(result.user);
  }catch(err){
    if(err.code === "auth/popup-blocked"){
      try{ await signInWithRedirect(auth, provider); }catch(e){ $("authError").textContent = t("authFailed") + " " + e.message; }
    } else if(err.code === "auth/popup-closed-by-user"){
      $("authError").textContent = "Login closed. Try again.";
    } else {
      $("authError").textContent = t("authFailed") + " " + (err.message||"");
    }
  }
};

try{
  const redirectResult = await getRedirectResult(auth);
  if(redirectResult?.user) await afterLogin(redirectResult.user);
}catch(e){ console.warn(e); }

onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;
    if(!myProfile) myProfile = await loadUserProfile(user.uid);
    updateTopAccount();
    await loadVideos();
    await loadMyLikesAndFollows();
  } else {
    currentUser = null; myProfile = null;
    updateTopAccount();
    renderFeed();
  }
});

updateTopAccount();
renderFeed();
</script>
